<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Vencimentos</title>
    <link rel="icon" href="/imagens/icone/icone.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style2.css">
</head>
<body>
    <div class="v-brand">❄ CONTROLE DE VENCIMENTOS</div>
    <div class="auth-container">

        <div class="form-side login-side" data-label="Login">
            <span class="auth-eyebrow">01 · acesso · · · · · · · · fig. LG-01</span>
            <h2>Acesse o <em>painel</em></h2>
            <input type="text" id="userLogin" placeholder="Usuário">
            <input type="password" id="passLogin" placeholder="Senha">
            <p id="erroLogin" class="mensagem-erro"></p>
            <button id="btnLogin">Entrar</button>
        </div>

        <div class="form-side register-side hidden-fields" data-label="Cadastro">
            <span class="auth-eyebrow">02 · nova conta</span>
            <h2>Criar <em>conta</em></h2>
            <input type="text" id="userReg" placeholder="Novo Usuário">
            <input type="password" id="passReg" placeholder="Nova Senha">
            <input type="password" id="passRegConfirma" placeholder="Confirme a Senha">
            <p id="erroCadastro" class="mensagem-erro"></p>
            <button id="btnRegister">Cadastrar</button>
        </div>

        <div id="slider-panel">
            <h2 id="slider-title">Cadastro</h2>
            <p id="slider-text">Ainda não tem conta?</p>
            <button id="btnToggle">Cadastrar</button>
        </div>

    </div>

    <script src="/auth.js"></script>
</body>
</html>
